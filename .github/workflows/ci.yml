name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  web:
    name: Repository, Web and browser E2E
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Locate pinned pnpm store
        id: pnpm-store
        run: |
          $store = corepack pnpm store path --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$store" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack pnpm install --frozen-lockfile
      - name: Check repository, memory, catalogs, styles and Web
        run: |
          New-Item -ItemType Directory -Force build/ci | Out-Null
          corepack pnpm check 2>&1 | Tee-Object build/ci/web-check.log
          exit $LASTEXITCODE
      - name: Install the configured Edge browser
        run: corepack pnpm --filter @whisper-subtitle/web exec playwright install msedge
      - name: Build Web and run browser E2E
        run: |
          corepack pnpm e2e 2>&1 | Tee-Object build/ci/browser-e2e.log
          exit $LASTEXITCODE
      - name: Preserve failed Web and browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-browser-diagnostics
          path: |
            build/ci/*.log
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn

  python:
    name: Python ${{ matrix.python }} without models
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Windows release-preflight tests also discover Node/Corepack and Cargo.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the base development environment (no Qwen extra)
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Run model-free Python suite
        run: |
          New-Item -ItemType Directory -Force build/ci | Out-Null
          python -m pytest -q --junitxml=build/ci/pytest.xml 2>&1 | Tee-Object build/ci/pytest.log
          exit $LASTEXITCODE
      - name: Preserve failed Python report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-${{ matrix.python }}-diagnostics
          path: |
            build/ci/pytest.xml
            build/ci/pytest.log
          retention-days: 7
          if-no-files-found: warn

  rust:
    name: Windows Rust Host
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Locate pinned pnpm store
        id: pnpm-store
        run: |
          $store = corepack pnpm store path --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$store" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack pnpm install --frozen-lockfile
      - name: Build embedded Web assets for Tauri
        run: corepack pnpm build
      - name: Install the repository Rust toolchain and components
        run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Test Rust Host
        working-directory: apps/desktop/src-tauri
        run: |
          New-Item -ItemType Directory -Force ../../../build/ci | Out-Null
          cargo test --locked 2>&1 | Tee-Object ../../../build/ci/cargo-test.log
          exit $LASTEXITCODE
      - name: Lint all Rust targets
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | Tee-Object ../../../build/ci/cargo-clippy.log
          exit $LASTEXITCODE
      - name: Preserve failed Rust diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-host-diagnostics
          path: build/ci/cargo-*.log
          retention-days: 7
          if-no-files-found: warn
