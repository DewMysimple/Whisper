[package]
name = "whisper-subtitle-desktop"
version = "0.1.0"
description = "WhisperSubtitle WebView desktop host"
authors = ["WhisperSubtitle contributors"]
edition = "2024"

[lib]
name = "whisper_subtitle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55.0"
