[package]
name = "whisper-subtitle-desktop"
version = "0.1.0"
description = "WhisperSubtitle WebView desktop host"
authors = ["WhisperSubtitle contributors"]
edition = "2024"

[lib]
name = "whisper_subtitle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
thiserror = "2"
