<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 544" width="100%" role="img">
  <title>WhisperSubtitle 工程架构总览</title>
  <desc>四层结构：启动层、GUI层、转录层、推理与输出层，展示调用与数据流向</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:#2C2C2A}
      .ts{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;fill:#5F5E5A}
      .th{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:500;fill:#2C2C2A}
      .lbl{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:500;fill:#444441}
      .cap{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;fill:#888780}
    </style>
  </defs>
  <text class="th" x="340" y="30" text-anchor="middle" font-size="15">WhisperSubtitle 工程架构总览</text>
  <rect x="40" y="50" width="600" height="86" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="lbl" x="56" y="71">① 启动层</text>
  <rect x="70" y="84" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="th" x="145" y="100" text-anchor="middle" dominant-baseline="central">Whisper.lnk</text>
  <text class="ts" x="145" y="118" text-anchor="middle" dominant-baseline="central">桌面快捷方式</text>
  <rect x="265" y="84" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="th" x="340" y="100" text-anchor="middle" dominant-baseline="central">launch.vbs</text>
  <text class="ts" x="340" y="118" text-anchor="middle" dominant-baseline="central">无控制台启动器</text>
  <rect x="460" y="84" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="th" x="535" y="100" text-anchor="middle" dominant-baseline="central">test_env.py</text>
  <text class="ts" x="535" y="118" text-anchor="middle" dominant-baseline="central">依赖与 CUDA 校验</text>
  <path class="arr" d="M220 106 L263 106" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path class="arr" d="M415 106 L458 106" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path class="arr" d="M300 138 L300 158" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="cap" x="308" y="152">pythonw 启动 GUI</text>
  <rect x="40" y="160" width="600" height="128" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="lbl" x="56" y="181">② GUI 层 · src/gui/WhisperPyQtGUI.py (PyQt5)</text>
  <rect x="70" y="194" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="145" y="214" text-anchor="middle" dominant-baseline="central">左栏 · 设置面板</text>
  <text class="ts" x="145" y="234" text-anchor="middle" dominant-baseline="central">路径/模式/开始停止</text>
  <rect x="265" y="194" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">中栏 · 参数/监视</text>
  <text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">AI参数表 · 4性能图表</text>
  <rect x="460" y="194" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="535" y="214" text-anchor="middle" dominant-baseline="central">右栏 · 日志</text>
  <text class="ts" x="535" y="234" text-anchor="middle" dominant-baseline="central">彩色高亮 · 复制清空</text>
  <text class="cap" x="340" y="276" text-anchor="middle">QProcess 子进程 · HF_HOME 注入 · stdout 回显 · psutil/pynvml 监控</text>
  <path class="arr" d="M300 290 L300 312" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="cap" x="230" y="305">QProcess 调用脚本</text>
  <path d="M380 312 L380 290" stroke="#7F77DD" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="cap" x="388" y="305" fill="#534AB7">stdout 日志回传</text>
  <rect x="40" y="314" width="600" height="120" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="lbl" x="56" y="335">③ 转录层 · src/core/ (三种模式互斥)</text>
  <rect x="70" y="348" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="145" y="366" text-anchor="middle" dominant-baseline="central">WhisperProjectCN</text>
  <text class="ts" x="145" y="384" text-anchor="middle" dominant-baseline="central">中文转录 (zh)</text>
  <text class="ts" x="145" y="400" text-anchor="middle" dominant-baseline="central">中文标点 · 开上下文</text>
  <rect x="265" y="348" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="340" y="366" text-anchor="middle" dominant-baseline="central">WhisperProject</text>
  <text class="ts" x="340" y="384" text-anchor="middle" dominant-baseline="central">英文标准版</text>
  <text class="ts" x="340" y="400" text-anchor="middle" dominant-baseline="central">上下文连贯 · 宽松阈值</text>
  <rect x="460" y="348" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="535" y="366" text-anchor="middle" dominant-baseline="central">WhisperProject2</text>
  <text class="ts" x="535" y="384" text-anchor="middle" dominant-baseline="central">英文防幻觉</text>
  <text class="ts" x="535" y="400" text-anchor="middle" dominant-baseline="central">关上下文 · 去重 clean_repetition</text>
  <text class="cap" x="340" y="426" text-anchor="middle">共用流程：递归扫描视频 → 合并句子 → 后处理 → 写 TXT</text>
  <path class="arr" d="M300 436 L300 458" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="cap" x="308" y="451">WhisperModel('large-v3-turbo')</text>
  <rect x="40" y="460" width="600" height="64" rx="12" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text class="lbl" x="56" y="481">④ 推理与输出</text>
  <text class="ts" x="340" y="500" text-anchor="middle" dominant-baseline="central">faster-whisper + CTranslate2 · CUDA float16 · 模型内置工程目录</text>
  <text class="ts" x="340" y="516" text-anchor="middle" dominant-baseline="central">→ 输出 Text/*.txt (含备份) + 可选桌面 .md</text>
</svg>
