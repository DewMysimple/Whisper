<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 300" width="100%" role="img">
  <title>Whisper 启动耗时分解</title>
  <desc>冷启动与热启动各阶段耗时对比，以及精简 test_env 后的预期</desc>
  <defs>
    <style>
      .t{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;fill:#2C2C2A}
      .ts{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;fill:#5F5E5A}
      .th{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:500;fill:#2C2C2A}
      .w{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:500;fill:#ffffff}
      .cap{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;fill:#888780}
    </style>
  </defs>
  <text class="th" x="340" y="26" text-anchor="middle" font-size="15">Whisper 启动耗时分解（实测）</text>
  <rect x="120" y="44" width="12" height="12" rx="2" fill="#EF9F27"/>
  <text class="ts" x="138" y="54">OS/DLL/Defender 扫描</text>
  <rect x="262" y="44" width="12" height="12" rx="2" fill="#7F77DD"/>
  <text class="ts" x="280" y="54">test_env: torch 预检</text>
  <rect x="404" y="44" width="12" height="12" rx="2" fill="#888780"/>
  <text class="ts" x="422" y="54">test_env 其他</text>
  <rect x="520" y="44" width="12" height="12" rx="2" fill="#378ADD"/>
  <text class="ts" x="538" y="54">GUI 启动</text>
  <line x1="120" y1="72" x2="600" y2="72" stroke="#e9ecef" stroke-width="0.5"/>
  <g stroke="#adb5bd" stroke-width="0.5">
    <line x1="120" y1="70" x2="120" y2="248"/>
    <line x1="240" y1="70" x2="240" y2="74"/>
    <line x1="360" y1="70" x2="360" y2="74"/>
    <line x1="480" y1="70" x2="480" y2="74"/>
    <line x1="600" y1="70" x2="600" y2="74"/>
  </g>
  <text class="cap" x="120" y="265" text-anchor="middle">0</text>
  <text class="cap" x="240" y="265" text-anchor="middle">2</text>
  <text class="cap" x="360" y="265" text-anchor="middle">4</text>
  <text class="cap" x="480" y="265" text-anchor="middle">6</text>
  <text class="cap" x="600" y="265" text-anchor="middle">8 秒</text>
  <text class="t" x="112" y="103" text-anchor="end">冷启动</text>
  <rect x="120" y="88" width="288" height="30" fill="#EF9F27"/>
  <rect x="408" y="88" width="60" height="30" fill="#7F77DD"/>
  <rect x="468" y="88" width="24" height="30" fill="#888780"/>
  <rect x="492" y="88" width="90" height="30" fill="#378ADD"/>
  <text class="w" x="264" y="107" text-anchor="middle">4.8s</text>
  <text class="w" x="438" y="107" text-anchor="middle">1.0</text>
  <text class="w" x="537" y="107" text-anchor="middle">1.5s</text>
  <text class="th" x="592" y="107">≈7.7s</text>
  <text class="t" x="112" y="158" text-anchor="end">热启动</text>
  <rect x="120" y="143" width="60" height="30" fill="#7F77DD"/>
  <rect x="180" y="143" width="18" height="30" fill="#888780"/>
  <rect x="198" y="143" width="30" height="30" fill="#378ADD"/>
  <text class="w" x="150" y="162" text-anchor="middle">1.0s</text>
  <text class="w" x="213" y="162" text-anchor="middle">0.5</text>
  <text class="th" x="236" y="162">≈1.8s</text>
  <text class="t" x="112" y="213" text-anchor="end">优化后</text>
  <rect x="120" y="198" width="9" height="30" fill="#1D9E75"/>
  <rect x="129" y="198" width="30" height="30" fill="#378ADD"/>
  <rect x="120" y="198" width="39" height="30" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 2" rx="3"/>
  <text class="th" x="167" y="213">≈0.65s</text>
  <text class="cap" x="220" y="213">精简 test_env 后（热启动省约 1.1s）</text>
  <text class="cap" x="340" y="288" text-anchor="middle">冷启动的 OS/DLL 扫描是大头 → 将 whisper_env 加入 Windows Defender 排除列表可消除该段</text>
</svg>
