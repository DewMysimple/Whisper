[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper_subtitle"
version = "0.1.0"
description = "Local faster-whisper transcription desktop application"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
    "nvidia-cublas-cu12>=12.0,<13",
]

[project.optional-dependencies]
dev = ["setuptools>=68,<82", "pytest>=7.0"]

[project.scripts]
whisper-subtitle = "whisper_subtitle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whisper_subtitle = ["resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
