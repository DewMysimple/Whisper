[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper_subtitle"
version = "0.1.0"
description = "Local faster-whisper transcription desktop application"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "PyQt5>=5.15",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0,<2.12",
    "torchaudio>=2.0,<2.12",
    "torchvision>=0.15,<0.27",
]
dev = ["setuptools>=68,<82", "pytest>=7.0"]

[project.scripts]
whisper-subtitle = "whisper_subtitle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
